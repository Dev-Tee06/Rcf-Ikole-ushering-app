plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rcf.ikole.ushering'
    compileSdk 36

    defaultConfig {
        applicationId "com.rcf.ikole.ushering"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("RCF_RELEASE_STORE_FILE") ?: "missing-release-key.jks")
            storePassword System.getenv("RCF_RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("RCF_RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RCF_RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("RCF_RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
